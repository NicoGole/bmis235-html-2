<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Nico Golesis">
  <title>John Correia's Podcasts</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      margin: 0;
      padding: 32px 6%;
      line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark {
      background: #121212;
      color: #f0f0f0;
    }

    .theme-toggle {
      font-size: 0.9rem;
      padding: 6px 14px;
      cursor: pointer;
      border: 1px solid currentColor;
      background: none;
      color: inherit;
      border-radius: 4px;
    }

    .picks {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      margin: 32px 0;
    }

    .picks a img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .picks h3 {
      text-align: center;
      font-size: 1rem;
      margin: 0 0 8px;
    }

    section.episode {
      scroll-margin-top: 24px;
      padding: 24px 0;
      border-top: 1px solid rgba(128, 128, 128, 0.3);
    }

    iframe {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
    }

    .to-top {
      display: inline-block;
      margin-top: 12px;
    }

    footer {
      margin-top: 48px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body id="top">

  <button class="theme-toggle" id="themeToggle" type="button">Dark mode on</button>

  <h1>Professor Correia's Podcasts</h1>
  <p>Email me at <a href="mailto:correia@gonzaga.edu">correia@gonzaga.edu</a> for episode suggestions.</p>

  <nav class="picks">
    <div>
      <h3>For the Mind</h3>
      <a href="#findingmastery">
        <img src="gervais.jpg" alt="Michael Gervais">
      </a>
    </div>
    <div>
      <h3>For the Body</h3>
      <a href="#huberman-lab">
        <img src="huberman.jpg" alt="Andrew Huberman">
      </a>
    </div>
    <div>
      <h3>For the Craft</h3>
      <a href="#fridman">
        <img src="fridman.jpg" alt="Lex Fridman">
      </a>
    </div>
  </nav>

  <section class="episode" id="findingmastery">
    <h2><a href="https://www.youtube.com/@FindingMastery">Finding Mastery</a></h2>
    <iframe src="https://www.youtube.com/embed/4L98ssI5Vxw"
      title="Finding Mastery"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <a class="to-top" href="#top">To top</a>
  </section>

  <section class="episode" id="huberman-lab">
    <h2><a href="https://www.youtube.com/@hubermanlab">Huberman Lab</a></h2>
    <iframe src="https://www.youtube.com/embed/pq6WHJzOkno"
      title="Huberman Lab"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <a class="to-top" href="#top">To top</a>
  </section>

  <section class="episode" id="fridman">
    <h2><a href="https://www.youtube.com/@lexfridman">Lex Fridman Podcast</a></h2>
    <iframe src="https://www.youtube.com/embed/kFQUDCgMjRc"
      title="Lex Fridman Podcast"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <a class="to-top" href="#top">To top</a>
  </section>

  <section class="episode" id="my-embed">
    <h2>My Embed</h2>
    <!-- Paste an embed iframe from another site here, such as a Google Maps or chart embed. -->
    <a class="to-top" href="#top">To top</a>
  </section>

  <footer>Built by Nico Golesis · BMIS 235</footer>

  <script>
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      const dark = document.body.classList.toggle('dark');
      toggle.textContent = dark ? 'Light mode on' : 'Dark mode on';
    });
  </script>

</body>
</html>
