<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Nico Golesis">
  <title>Nico Golesis's Podcasts</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      margin: 0;
      padding: 32px 6%;
      line-height: 1.6;
    }

    body.dark {
      background: #121212;
      color: #f0f0f0;
    }

    .picks img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    iframe {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
    }

    section { scroll-margin-top: 24px; padding: 24px 0; }

    .map img {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .map figcaption {
      font-size: 0.9rem;
      margin-top: 10px;
      opacity: 0.8;
    }

    footer { margin-top: 48px; font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body id="top">

  <button id="themeToggle" type="button">Dark mode on</button>

  <h1>Nico Golesis's Podcasts</h1>
  <p>Email me at <a href="mailto:correia@gonzaga.edu">correia@gonzaga.edu</a> for episode suggestions.</p>

  <h2>For the Mind</h2>
  <p class="picks">
    <a href="#findingmastery"><img src="gervais.jpg" alt="Michael Gervais"></a>
  </p>

  <h2>For the Body</h2>
  <p class="picks">
    <a href="#huberman-lab"><img src="huberman.jpg" alt="Andrew Huberman"></a>
  </p>

  <h2>For the Craft</h2>
  <p class="picks">
    <a href="#fridman"><img src="fridman.jpg" alt="Lex Fridman"></a>
  </p>

  <section id="findingmastery">
    <h2><a href="https://www.youtube.com/@FindingMastery">Finding Mastery</a></h2>
    <iframe src="https://www.youtube.com/embed/4L98ssI5Vxw" title="Finding Mastery"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <p><a href="#top">To top</a></p>
  </section>

  <section id="huberman-lab">
    <h2><a href="https://www.youtube.com/@hubermanlab">Huberman Lab</a></h2>
    <iframe src="https://www.youtube.com/embed/pq6WHJzOkno" title="Huberman Lab"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <p><a href="#top">To top</a></p>
  </section>

  <section id="fridman">
    <h2><a href="https://www.youtube.com/@lexfridman">Lex Fridman Podcast</a></h2>
    <iframe src="https://www.youtube.com/embed/kFQUDCgMjRc" title="Lex Fridman Podcast"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    <p><a href="#top">To top</a></p>
  </section>

  <section id="myembed" class="map">
    <h2>Where I study: Gonzaga University</h2>
    <figure>
      <img src="gonzaga%20map.jpg" alt="Map of the Gonzaga University campus in Spokane, Washington, with the Gonzaga campus inset and Lake Arthur">
      <figcaption>Gonzaga University campus map</figcaption>
    </figure>
    <p><a href="#top">To top</a></p>
  </section>

  <footer>Built by Nico Golesis · BMIS 235</footer>

  <script>
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      const dark = document.body.classList.toggle('dark');
      toggle.textContent = dark ? 'Dark mode off' : 'Dark mode on';
    });
  </script>

</body>
</html>
